name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create GitHub Releases

jobs:
  release:
    name: Detekt · Lint · Tests · Signed Release Build
    if: github.repository == 'dalapenko/laba'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Version guard ────────────────────────────────────────────────────────

      - name: Check tag matches versionName
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Tag version : $TAG_VERSION"
          echo "App version : $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: tag '$TAG_NAME' does not match versionName '$APP_VERSION' in app/build.gradle.kts"
            exit 1
          fi

      # ── Secrets setup ────────────────────────────────────────────────────────

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Write signing config to local.properties
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          {
            echo "signing.storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "signing.storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "signing.keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "signing.keyPassword=$KEYSTORE_KEY_PASSWORD"
          } >> local.properties

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      # ── Quality checks ───────────────────────────────────────────────────────

      - name: Run Detekt
        run: ./gradlew detektAll

      - name: Run Lint
        run: ./gradlew :app:lintRelease

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      # ── Release build ────────────────────────────────────────────────────────

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laba-${{ github.ref_name }}
          path: app/build/outputs/apk/release/laba-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          files: app/build/outputs/apk/release/laba-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
